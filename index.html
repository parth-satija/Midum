            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],

    <style>
        :root {
            --bg-page: #05070c;
            --text: #e5e7eb;
            --text-strong: #ffffff;
            --text-muted: #9ca3af;
            --panel-bg: rgba(11, 15, 25, 0.7);
            --panel-hover: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.07);
            --accent: #60a5fa;
            --glow-opacity: 0.12;
            --code-bg: rgba(59,130,246,0.08);
            --code-border: rgba(59,130,246,0.18);
            --code-text: #93c5fd;
            --pre-bg: #0a0e17;
            --pre-text: #cbd5e1;
        }
        html.light {
            --bg-page: #f7f9fc;
            --text: #1f2937;
            --text-strong: #10182b;
            --text-muted: #5b6676;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --panel-hover: rgba(226, 232, 240, 0.8);
            --border: rgba(15, 23, 42, 0.1);
            --accent: #1d4ed8;
            --glow-opacity: 0.08;
            --code-bg: rgba(29, 78, 216, 0.06);
            --code-border: rgba(29, 78, 216, 0.18);
            --code-text: #1d4ed8;
            --pre-bg: #eef2f9;
            --pre-text: #1f2937;
        }

        body { background: var(--bg-page); color: var(--text); overflow-x: hidden; transition: background-color .25s, color .25s; }
        .t-strong { color: var(--text-strong); }
        .t-muted { color: var(--text-muted); }
        .t-accent { color: var(--accent); }
        .bdr { border-color: var(--border); }
        .glass-panel { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); }
        .ambient-glow { filter: blur(130px); opacity: var(--glow-opacity); pointer-events: none; }

        /* theme toggle */
        #theme-toggle { width: 2.25rem; height: 2.25rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--panel-bg); color: var(--text-strong); cursor: pointer; transition: transform .15s; }
        #theme-toggle:hover { transform: scale(1.06); }
        #theme-toggle svg { width: 1.1rem; height: 1.1rem; }
        html.light #icon-moon { display: none; }
        html:not(.light) #icon-sun { display: none; }

        /* hero */
        .hero-title { background: linear-gradient(90deg, var(--text-strong), var(--accent), #5eead4); -webkit-background-clip: text; background-clip: text; color: transparent; }

        /* search */
        #search { width: 100%; background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-strong); border-radius: .75rem; padding: .8rem 1rem .8rem 2.6rem; font-size: .95rem; outline: none; transition: border-color .2s, box-shadow .2s; }
        #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(96,165,250,.15); }

        /* home categories */
        .cat-heading { color: var(--text-strong); font-weight: 700; display: flex; align-items: baseline; gap: .6rem; }
        .cat-count { font-size: .7rem; font-weight: 600; color: var(--text-muted); border: 1px solid var(--border); padding: .05rem .5rem; border-radius: 9999px; }
        .sub-cat { margin-top: 1.5rem; padding-left: 1rem; border-left: 2px solid var(--border); }
        .doc-card { display: flex; align-items: center; gap: .65rem; padding: .75rem 1rem; border-radius: .7rem; background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-strong); font-size: .92rem; font-weight: 500; transition: background-color .15s, border-color .15s, transform .15s; }
        .doc-card:hover { background: var(--panel-hover); border-color: var(--accent); transform: translateY(-1px); }
        .doc-card .ico { color: var(--accent); flex-shrink: 0; }

        /* sidebar */
        .side-link { display: block; padding: .3rem .6rem; border-radius: .45rem; font-size: .85rem; color: var(--text-muted); transition: background-color .15s, color .15s; }
        .side-link:hover { background: var(--panel-hover); color: var(--text-strong); }
        .side-link.active { background: var(--code-bg); color: var(--accent); font-weight: 600; }
        .side-group > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: .35rem; padding: .35rem .6rem; font-size: .78rem; font-weight: 700; letter-spacing: .03em; color: var(--text-strong); border-radius: .45rem; }
        .side-group > summary::-webkit-details-marker { display: none; }
        .side-group > summary:hover { background: var(--panel-hover); }
        .side-group > summary .chev { transition: transform .2s; color: var(--accent); }
        .side-group[open] > summary .chev { transform: rotate(90deg); }
        .side-children { margin-left: .75rem; padding-left: .5rem; border-left: 1px solid var(--border); }

        /* markdown content */
        .md { color: var(--text); line-height: 1.75; font-size: .97rem; overflow-wrap: anywhere; }
        .md > *:first-child { margin-top: 0; }
        .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { color: var(--text-strong); font-weight: 700; line-height: 1.3; scroll-margin-top: 6rem; }
        .md h1 { font-size: 2rem; margin: 0 0 1.25rem; }
        .md h2 { font-size: 1.5rem; margin: 2.5rem 0 1rem; padding-bottom: .4rem; border-bottom: 1px solid var(--border); }
        .md h3 { font-size: 1.2rem; margin: 2rem 0 .75rem; }
        .md h4 { font-size: 1.05rem; margin: 1.5rem 0 .5rem; }
        .md p { margin: .9rem 0; }
        .md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
        .md strong { color: var(--text-strong); }
        .md ul, .md ol { margin: .9rem 0; padding-left: 1.5rem; }
        .md ul { list-style: disc; }
        .md ol { list-style: decimal; }
        .md li { margin: .3rem 0; }
        .md li > ul, .md li > ol { margin: .3rem 0; }
        .md blockquote { margin: 1.1rem 0; padding: .6rem 1rem; border-left: 3px solid var(--accent); background: var(--code-bg); border-radius: 0 .5rem .5rem 0; color: var(--text-muted); }
        .md hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
        .md img { max-width: 100%; height: auto; border-radius: .6rem; border: 1px solid var(--border); margin: 1rem 0; cursor: zoom-in; display: block; }
        .md img.img-broken { display: inline-block; padding: .4rem .75rem; font-size: .8rem; color: var(--text-muted); cursor: default; }
        .md code { font-family: 'JetBrains Mono', monospace; background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 4px; padding: .1rem .4rem; font-size: .85em; color: var(--code-text); }
        .md pre { font-family: 'JetBrains Mono', monospace; background: var(--pre-bg); border: 1px solid var(--border); border-radius: .6rem; padding: 1rem 1.25rem; overflow-x: auto; font-size: .8rem; line-height: 1.55; color: var(--pre-text); margin: 1.1rem 0; }
        .md pre code { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; }
        .md .table-wrap { overflow-x: auto; margin: 1.1rem 0; }
        .md table { border-collapse: collapse; width: 100%; font-size: .9rem; }
        .md th, .md td { border: 1px solid var(--border); padding: .5rem .75rem; text-align: left; vertical-align: top; }
        .md th { background: var(--code-bg); color: var(--text-strong); font-weight: 600; }

        /* lightbox */
        #lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 2rem; cursor: zoom-out; }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: 100%; max-height: 100%; border-radius: .5rem; }

        .spinner { width: 1.75rem; height: 1.75rem; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 9999px; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

    <script>
    (function () {
        'use strict';

        /* ---------------- Configuration ---------------- */
        const DOCS_DIR = 'docs/';                 // folder in the same directory as this file
        const TITLE = 'Midum Documentation';
        const SUBTITLE = 'End-User Documentation for Midum';
        // Fallback for static hosts (e.g. GitHub Pages) that can't list directories.
        const GITHUB = { owner: 'parth-satija', repo: 'Midum', ref: 'HEAD', dir: 'docs/' };

        const app = document.getElementById('app');
        const docsBase = new URL(DOCS_DIR, location.href);

        let tree = null;          // root node of the docs tree
        let loadError = null;
        let searchQuery = '';

        /* ---------------- Helpers ---------------- */
        const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // "getting_started.md" -> "getting started"  (same capitalization, underscores -> spaces)
        const pretty = name => name.replace(/\.md$/i, '').replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();

        const encPath = p => p.split('/').map(encodeURIComponent).join('/');
        const docUrl = p => new URL(encPath(p), docsBase).href;
        const routeFor = p => '#/' + encPath(p);

        const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
        const byName = (a, b) => {
            const ar = /^readme(\.md)?$/i.test(a.name), br = /^readme(\.md)?$/i.test(b.name);
            if (ar !== br) return ar ? -1 : 1;
            return collator.compare(pretty(a.name), pretty(b.name));
        };

        /* ---------------- Discovering the docs ---------------- */
        // Crawl the directory listing the web server provides for docs/ (python -m http.server,
        // nginx/apache autoindex, etc.), recursing into every sub folder.
        async function crawl(dirUrl, rel, out) {
            const res = await fetch(dirUrl, { cache: 'no-cache' });
            if (!res.ok) throw new Error('HTTP ' + res.status + ' listing ' + dirUrl);
            const html = await res.text();
            const page = new DOMParser().parseFromString(html, 'text/html');
            const base = new URL(dirUrl);
            const subdirs = [];
            let anchors = 0;

            page.querySelectorAll('a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('?')) return;
                let u;
                try { u = new URL(href, base); } catch { return; }
                if (u.origin !== base.origin) return;
                if (!u.pathname.startsWith(base.pathname) || u.pathname === base.pathname) return;
                const rest = u.pathname.slice(base.pathname.length);
                const isDir = rest.endsWith('/');
                const name = decodeURIComponent(rest.replace(/\/$/, ''));
                if (!name || name.includes('/') || name.startsWith('.')) return;
                anchors++;
                if (isDir) subdirs.push(name);
                else if (/\.md$/i.test(name)) out.push(rel + name);
            });

            if (!anchors && !/<a\s/i.test(html)) throw new Error('No directory listing at ' + dirUrl);
            await Promise.all(subdirs.map(d => crawl(new URL(encodeURIComponent(d) + '/', base).href, rel + d + '/', out)));
        }

        async function discoverFromListing() {
            const out = [];
            await crawl(docsBase.href, '', out);
            if (!out.length) throw new Error('Directory listing contained no .md files');
            return out;
        }

        async function discoverFromGitHub() {
            const { owner, repo, ref, dir } = GITHUB;
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${ref}?recursive=1`);
            if (!res.ok) throw new Error('GitHub API HTTP ' + res.status);
            const data = await res.json();
            const files = (data.tree || [])
                .filter(n => n.type === 'blob' && n.path.startsWith(dir) && /\.md$/i.test(n.path))
                .map(n => n.path.slice(dir.length))
                .filter(p => !p.split('/').some(s => s.startsWith('.')));
            if (!files.length) throw new Error('No .md files found in GitHub repo');
            return files;
        }

        function buildTree(paths) {
            const root = { name: '', path: '', dirs: [], files: [] };
            paths.forEach(p => {
                const parts = p.split('/');
                let node = root;
                parts.slice(0, -1).forEach((seg, i) => {
                    let child = node.dirs.find(d => d.name === seg);
                    if (!child) {
                        child = { name: seg, path: parts.slice(0, i + 1).join('/'), dirs: [], files: [] };
                        node.dirs.push(child);
                    }
                    node = child;
                });
                node.files.push({ name: parts[parts.length - 1], path: p });
            });
            const sortNode = n => { n.dirs.sort(byName); n.files.sort(byName); n.dirs.forEach(sortNode); };
            sortNode(root);
            return root;
        }

        async function loadTree() {
            const errors = [];
            for (const strategy of [discoverFromListing, discoverFromGitHub]) {
                try { return buildTree(await strategy()); }
                catch (e) { errors.push(e.message); }
            }
            const err = new Error(errors.join(' | '));
            err.isFile = location.protocol === 'file:';
            throw err;
        }

        const countDocs = n => n.files.length + n.dirs.reduce((s, d) => s + countDocs(d), 0);

        /* ---------------- Home page ---------------- */
        const docIcon = '<svg class="ico w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg>';

        function matches(file, catLabel, q) {
            if (!q) return true;
            return (pretty(file.name) + ' ' + catLabel).toLowerCase().includes(q);
        }

        function categoryHTML(node, depth, q, trail) {
            const label = trail ? trail + ' / ' + pretty(node.name) : pretty(node.name);
            const files = node.files.filter(f => matches(f, label, q));
            const kids = node.dirs.map(d => categoryHTML(d, depth + 1, q, label)).join('');
            if (!files.length && !kids) return '';
            const h = depth === 0 ? 'text-2xl' : 'text-lg';
            return `
            <section class="${depth ? 'sub-cat' : 'mt-12'}">
                <h2 class="cat-heading ${h}">${esc(pretty(node.name))}<span class="cat-count">${countDocs(node)} ${countDocs(node) === 1 ? 'doc' : 'docs'}</span></h2>
                ${files.length ? `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">${files.map(cardHTML).join('')}</div>` : ''}
                ${kids}
            </section>`;
        }

        function cardHTML(f) {
            return `<a class="doc-card" href="${routeFor(f.path)}">${docIcon}<span>${esc(pretty(f.name))}</span></a>`;
        }

        function renderHome() {
            document.title = TITLE;
            const q = searchQuery.trim().toLowerCase();
            app.innerHTML = `
            <header class="text-center pt-6 pb-4">
                <h1 class="hero-title text-4xl sm:text-6xl font-extrabold tracking-tight pb-1">${esc(TITLE)}</h1>
                <p class="t-muted text-base sm:text-lg mt-3 font-light">${esc(SUBTITLE)}</p>
                <div class="relative max-w-xl mx-auto mt-8">
                    <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 t-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                    <input id="search" type="search" placeholder="Search documentation…" autocomplete="off" value="${esc(searchQuery)}">
                </div>
            </header>
            <div id="home-list"></div>`;
            const input = document.getElementById('search');
            input.addEventListener('input', () => { searchQuery = input.value; renderHomeList(); });
            renderHomeList();
        }

        function renderHomeList() {
            const el = document.getElementById('home-list');
            if (!el) return;
            if (loadError) { el.innerHTML = errorHTML(); return; }
            if (!tree) { el.innerHTML = loadingHTML(); return; }
            const q = searchQuery.trim().toLowerCase();

            let html = '';
            const general = tree.files.filter(f => matches(f, 'General', q));
            if (general.length) {
                html += `<section class="mt-12">
                    <h2 class="cat-heading text-2xl">General<span class="cat-count">${tree.files.length} ${tree.files.length === 1 ? 'doc' : 'docs'}</span></h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">${general.map(cardHTML).join('')}</div>
                </section>`;
            }
            html += tree.dirs.map(d => categoryHTML(d, 0, q, '')).join('');
            el.innerHTML = html || `<p class="text-center t-muted mt-16">No documents match “${esc(searchQuery)}”.</p>`;
        }

        const loadingHTML = () => `<div class="flex flex-col items-center gap-3 mt-20 t-muted"><div class="spinner"></div><p class="text-sm">Loading documentation…</p></div>`;

        function errorHTML() {
            const hint = loadError && loadError.isFile
                ? `<p class="mt-3">This page was opened directly from disk, and browsers block <code>fetch()</code> on <code>file://</code> pages. Serve the folder over HTTP instead:</p>
                   <pre class="mt-3 text-left text-sm overflow-x-auto" style="background:var(--pre-bg);border:1px solid var(--border);border-radius:.6rem;padding:1rem">cd midum_pkg
python -m http.server 8000
# then open http://localhost:8000</pre>`
                : `<p class="mt-3">Make sure the <code>docs/</code> folder sits next to <code>index.html</code> and the web server allows directory listing.</p>`;
            return `<div class="glass-panel rounded-xl p-8 max-w-2xl mx-auto mt-16 text-center t-muted">
                <h2 class="t-strong text-xl font-bold">Couldn’t load the documentation</h2>${hint}
                <p class="mt-3 text-xs opacity-70">${esc(loadError ? loadError.message : '')}</p></div>`;
        }

        /* ---------------- Document page ---------------- */
        function findFile(node, path) {
            for (const f of node.files) if (f.path === path) return f;
            for (const d of node.dirs) { const r = findFile(d, path); if (r) return r; }
            return null;
        }

        function sidebarHTML(node, current, isRoot) {
            const files = node.files.map(f =>
                `<a class="side-link ${f.path === current ? 'active' : ''}" href="${routeFor(f.path)}">${esc(pretty(f.name))}</a>`).join('');
            const dirs = node.dirs.map(d => {
                const open = current.startsWith(d.path + '/');
                return `<details class="side-group" ${open ? 'open' : ''}>
                    <summary><span class="chev">›</span>${esc(pretty(d.name))}</summary>
                    <div class="side-children">${sidebarHTML(d, current, false)}</div></details>`;
            }).join('');
            if (isRoot && node.files.length && node.dirs.length) {
                return `<details class="side-group" ${current.includes('/') ? '' : 'open'}>
                    <summary><span class="chev">›</span>General</summary><div class="side-children">${files}</div></details>${dirs}`;
            }
            return files + dirs;
        }

        function slugify(t) {
            return t.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
        }

        function processContent(root, path) {
            const fileUrl = new URL(docUrl(path));

            // images: resolve relative to the markdown file's own folder
            root.querySelectorAll('img').forEach(img => {
                const src = img.getAttribute('src');
                if (src && !/^(data:|blob:)/i.test(src)) {
                    try { img.setAttribute('src', new URL(src, fileUrl).href); } catch {}
                }
                img.setAttribute('loading', 'lazy');
                img.addEventListener('error', () => {
                    img.classList.add('img-broken');
                    img.removeAttribute('src');
                    img.insertAdjacentText('afterend', '');
                    img.alt = '[Image not found: ' + (img.alt || src || '') + ']';
                    img.style.cssText = 'width:auto';
                    const note = document.createElement('span');
                    note.className = 't-muted text-xs';
                    note.textContent = img.alt;
                    img.replaceWith(note);
                }, { once: true });
            });

            // links: .md -> in-app route, other relative -> real URL, external -> new tab
            root.querySelectorAll('a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (!href || href.startsWith('#')) return;
                let u;
                try { u = new URL(href, fileUrl); } catch { return; }
                if (u.origin === docsBase.origin && u.pathname.startsWith(docsBase.pathname) && /\.md$/i.test(u.pathname)) {
                    const rel = decodeURIComponent(u.pathname.slice(docsBase.pathname.length));
                    a.setAttribute('href', routeFor(rel));
                } else {
                    a.setAttribute('href', u.href);
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                }
            });

            // headings get ids (for in-page anchor links)
            const used = new Set();
            root.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
                let id = slugify(h.textContent) || 'section', n = id, i = 1;
                while (used.has(n)) n = id + '-' + (++i);
                used.add(n); h.id = n;
            });

            // scrollable tables
            root.querySelectorAll('table').forEach(t => {
                const wrap = document.createElement('div');
                wrap.className = 'table-wrap';
                t.replaceWith(wrap); wrap.appendChild(t);
            });
        }

        async function renderDoc(path) {
            const file = tree && findFile(tree, path);
            const crumbs = path.split('/').map(pretty);
            const title = crumbs[crumbs.length - 1];
            document.title = title + ' — ' + TITLE;

            app.innerHTML = `
            <div class="flex items-center justify-between lg:hidden mb-4">
                <a href="#/" class="text-sm t-accent">← All docs</a>
                <button id="menu-btn" class="text-sm t-muted border bdr rounded-lg px-3 py-1.5">Browse docs</button>
            </div>
            <div class="flex gap-10">
                <aside id="sidebar" class="hidden lg:block w-64 shrink-0">
                    <div class="sticky top-6 max-h-[calc(100vh-3rem)] overflow-y-auto pr-2">
                        <a href="#/" class="hidden lg:flex items-center gap-1.5 text-sm t-accent mb-4 px-2">← All docs</a>
                        ${tree ? sidebarHTML(tree, path, true) : ''}
                    </div>
                </aside>
                <article class="min-w-0 flex-1">
                    <p class="text-xs t-muted mb-4">${crumbs.map(esc).join(' <span class="opacity-50">/</span> ')}</p>
                    <div id="doc-body" class="md">${loadingHTML()}</div>
                </article>
            </div>`;
            document.getElementById('menu-btn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('hidden');
            });
            window.scrollTo(0, 0);

            const body = document.getElementById('doc-body');
            try {
                const res = await fetch(docUrl(path), { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                let md = (await res.text()).replace(/^\uFEFF/, '');
                const html = DOMPurify.sanitize(marked.parse(md, { gfm: true, breaks: false }));
                const tpl = document.createElement('div');
                tpl.innerHTML = html;
                processContent(tpl, path);
                body.innerHTML = '';
                body.append(...tpl.childNodes);
            } catch (e) {
                body.innerHTML = `<div class="glass-panel rounded-xl p-6 t-muted"><h2 class="t-strong text-lg font-bold" style="margin:0">Document not found</h2>
                    <p>Couldn’t load <code>${esc(path)}</code> (${esc(e.message)}).</p><p><a href="#/">Back to all docs</a></p></div>`;
            }
        }

        /* ---------------- Router ---------------- */
        function currentPath() {
            const h = location.hash;
            if (!h.startsWith('#/') || h.length <= 2) return '';
            try { return h.slice(2).split('/').map(decodeURIComponent).join('/'); } catch { return ''; }
        }

        function route() {
            const p = currentPath();
            if (p) renderDoc(p); else renderHome();
        }

        window.addEventListener('hashchange', route);

        // In-page anchors (#heading) inside a document
        document.addEventListener('click', e => {
            const a = e.target.closest && e.target.closest('.md a[href^="#"]');
            if (a && !a.getAttribute('href').startsWith('#/')) {
                e.preventDefault();
                const el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            }
            const img = e.target.closest && e.target.closest('.md img');
            if (img && img.src) {
                const lb = document.getElementById('lightbox');
                lb.querySelector('img').src = img.src;
                lb.classList.add('open');
            }
        });
        document.getElementById('lightbox').addEventListener('click', e => e.currentTarget.classList.remove('open'));
        document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open'); });

        /* ---------------- Theme ---------------- */
        (function () {
            const root = document.documentElement;
            const set = mode => { root.classList.toggle('light', mode === 'light'); try { localStorage.setItem('midum-theme', mode); } catch {} };
            let stored = null;
            try { stored = localStorage.getItem('midum-theme'); } catch {}
            set(stored || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
            document.getElementById('theme-toggle').addEventListener('click', () => set(root.classList.contains('light') ? 'dark' : 'light'));
        })();

        /* ---------------- Boot ---------------- */
        route(); // shows loading state immediately
        loadTree().then(t => { tree = t; }).catch(e => { loadError = e; }).finally(route);
    })();
    </script>
</body>
</html>
