name: Build and Attach Release Executable

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest  # Change to ubuntu-latest or macos-latest if target OS differs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip' # Caches dependencies if a requirements.txt exists

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
          # Install your project dependencies if applicable:
          # if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "midum" --collect-all PyQt5 gui/app.py
        # Options used:
        # --onefile : Bundles everything into a single binary
        # --noconsole : Suppresses the command prompt window (remove if CLI tool)
        # --name : Sets the output executable file name
        # --collect-all PyQt5 : Forces PyInstaller to pull in every PyQt5/
        #   PyQtWebEngine data file, binary, and plugin (Qt platform plugins,
        #   QtWebEngineProcess.exe, translations/resources/icudtl.dat). The
        #   app's GUI (gui/app.py) is a pywebview window rendered through
        #   QtWebEngine -- without --collect-all, PyInstaller's static
        #   analysis often misses these non-Python resources in --onefile
        #   mode, which is why the UI silently failed to start (main() calls
        #   sys.exit(1) when QtWebEngineWidgets isn't importable, invisible
        #   under --noconsole) and the exe came out a fraction of its real size.

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/midum.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
