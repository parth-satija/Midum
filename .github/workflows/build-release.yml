name: Build and Release (Windows)

# Publishing a GitHub Release builds the app, zips it, builds the small web
# installer, and attaches everything to that release:
#   Midum-Setup.exe               <- what users download (tiny web installer)
#   Midum-windows-x64.zip         <- the actual app (fetched by the installer)
#   Midum-windows-x64.zip.sha256  <- checksum the installer verifies
#
# Run it manually (Actions tab -> Run workflow) to get a test build as a
# downloadable artifact without publishing anything.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for a manual test build"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RAW_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # widest wheel coverage for PyQt5 / pywin32 / etc.
          cache: pip

      - name: Compute version
        shell: pwsh
        run: |
          $v = "$env:RAW_VERSION".Trim().TrimStart('v')
          if (-not $v) { $v = "0.0.0-dev" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building Midum $v"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app (PyInstaller, one-folder)
        shell: pwsh
        run: pyinstaller packaging/midum.spec --noconfirm --clean --distpath dist --workpath build/pyi

      - name: Smoke test (does it start and stay up?)
        # Informational: a failure here is reported but doesn't block packaging,
        # because a headless runner can behave differently from a real desktop.
        continue-on-error: true
        shell: pwsh
        run: |
          $env:MIDUM_HOME = Join-Path $env:RUNNER_TEMP "midum-smoke"
          $proc = Start-Process -FilePath "dist\Midum\Midum.exe" -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $proc.HasExited
          if ($alive) { taskkill /PID $proc.Id /T /F | Out-Null }
          $log = Join-Path $env:MIDUM_HOME "logs\midum.log"
          if (Test-Path $log) { Write-Host "---- last log lines ----"; Get-Content $log -Tail 80 }
          if (-not $alive) { throw "Midum.exe exited early with code $($proc.ExitCode)" }
          Write-Host "Midum.exe stayed running for 30s."

      - name: Defender scan of the built app (informational)
        # Shows in the Actions log whether Microsoft Defender flags the fresh build, before any user does.
        continue-on-error: true
        shell: pwsh
        run: |
          Update-MpSignature -ErrorAction SilentlyContinue
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          & $mp -Scan -ScanType 3 -File "$env:GITHUB_WORKSPACE\dist\Midum" -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Defender reported a detection or scan error (exit code $LASTEXITCODE) -- see the log above." }
          Write-Host "Defender found nothing."

      - name: Package zip + checksum
        shell: pwsh
        run: |
          Set-Content -Path "dist\Midum\VERSION" -Value $env:VERSION -NoNewline -Encoding ascii
          $zip = Join-Path $env:GITHUB_WORKSPACE "Midum-windows-x64.zip"
          Push-Location "dist\Midum"
          7z a -tzip -mx=5 $zip ".\*" | Out-Null
          Pop-Location
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value "$hash  Midum-windows-x64.zip" -Encoding ascii
          Write-Host "sha256: $hash"
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Build web installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" "packaging\installer\midum-web.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Copy-Item "packaging\installer\Output\Midum-Setup.exe" $env:GITHUB_WORKSPACE

      # --- Optional: code signing (removes most SmartScreen / AV warnings) ---
      # Add a code-signing certificate as repo secrets and sign BOTH Midum.exe
      # (before zipping) and Midum-Setup.exe, e.g. with signtool or
      # azure/trusted-signing-action. Left out until a certificate exists.

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midum-windows-${{ env.VERSION }}
          path: |
            Midum-Setup.exe
            Midum-windows-x64.zip
            Midum-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Midum-Setup.exe
            Midum-windows-x64.zip
            Midum-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
