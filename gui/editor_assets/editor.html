<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Midum Editor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#05070c;--panel:#0b0f19;--surface:#0d1220;--surface2:#121a2c;--border:#141a26;--border2:#1f2937;
  --accent:#60a5fa;--accent-dim:#3b82f6;--accent-faint:#0f1e33;--text:#f3f4f6;--subtext:#9ca3af;--muted:#4b5563;
  --green:#10b981;--red:#ef4444;--yellow:#f59e0b;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:12px/1.4 var(--ui);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
#app{display:flex;height:100%;width:100%}
/* ── sidebar ── */
#side{width:260px;min-width:160px;max-width:70%;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:0 0 auto;overflow:hidden}
#side.hidden{display:none}
#resizer{width:4px;margin-left:-2px;cursor:col-resize;flex:0 0 auto;z-index:5;position:relative}
#resizer:hover,#resizer.drag{background:var(--accent)}
.side-title{height:30px;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--subtext);flex:0 0 auto}
.side-title .sp{flex:1}
.ib{background:none;border:0;border-radius:4px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--subtext);cursor:pointer;padding:0}
.ib:hover{background:var(--surface2);color:var(--text)}
.ib svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sec{display:flex;flex-direction:column;min-height:0}
.sec.ws{flex:1 1 auto}
.sec.art{flex:0 1 auto;max-height:45%;border-top:1px solid var(--border)}
.sec-hdr{display:flex;align-items:center;height:24px;padding:0 4px 0 6px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text);cursor:pointer;text-transform:uppercase;flex:0 0 auto;background:var(--surface)}
.sec-hdr .chev{width:14px;height:14px;transition:transform .12s;flex:0 0 auto}
.sec.closed .sec-hdr .chev{transform:rotate(-90deg)}
.sec-hdr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:2px}
.sec-hdr .cnt{background:var(--accent-faint);color:var(--accent);border-radius:9px;padding:0 6px;font-size:10px;margin-right:4px}
.sec-hdr .acts{display:none}
.sec-hdr:hover .acts{display:flex}
.sec-body{overflow:auto;flex:1 1 auto;min-height:0;padding-bottom:6px;outline:none}
.sec.closed .sec-body{display:none}
.row{display:flex;align-items:center;height:22px;padding-right:8px;cursor:pointer;white-space:nowrap;color:var(--subtext);gap:5px}
.row:hover{background:var(--surface2);color:var(--text)}
.row.sel{background:var(--accent-faint);color:var(--text)}
.row.act{color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.row .chev{width:14px;height:14px;flex:0 0 14px;color:var(--muted);transition:transform .1s;fill:none;stroke:currentColor;stroke-width:2.2}
.row .chev.open{transform:rotate(90deg)}
.row .gap{width:14px;flex:0 0 14px}
.row .r-name{overflow:hidden;text-overflow:ellipsis}
.row .r-badge{margin-left:auto;font-size:10px;color:var(--muted);padding-left:6px}
.row .fold{width:15px;height:15px;flex:0 0 15px;fill:var(--accent-dim);opacity:.85}
.row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--accent);color:var(--text);border-radius:3px;height:18px;font:inherit;padding:0 4px;outline:none;user-select:text;-webkit-user-select:text}
.fi{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:14px;padding:0 2px;border-radius:3px;font:700 8px/1 var(--ui);letter-spacing:-.2px;flex:0 0 auto}
.empty-note{padding:10px 14px;color:var(--muted);font-size:11px;line-height:1.5}
.empty-note button{margin-top:8px;display:block}
.btn{background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:4px 12px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent-dim);border-color:var(--accent-dim);color:#fff}
/* ── center ── */
#center{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#tabs-wrap{display:flex;background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto;height:34px}
#tabs{display:flex;overflow-x:auto;overflow-y:hidden;flex:1 1 auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs-actions{display:flex;align-items:center;padding:0 4px;flex:0 0 auto}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 10px;border-right:1px solid var(--border);color:var(--subtext);cursor:pointer;min-width:84px;max-width:230px;flex:0 0 auto;position:relative}
.tab:hover{background:var(--surface)}
.tab.active{background:var(--bg);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab.preview .t-name{font-style:italic}
.tab.deleted .t-name{text-decoration:line-through;opacity:.7}
.tab.dragover{box-shadow:inset 2px 0 0 var(--accent)}
.t-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-badge{font-size:9px;color:var(--muted);border:1px solid var(--border2);border-radius:3px;padding:0 3px}
.t-close{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;opacity:0;flex:0 0 auto}
.tab:hover .t-close,.tab.active .t-close,.tab.dirty .t-close{opacity:1}
.t-close:hover{background:var(--surface2)}
.t-close svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.t-close .dot{width:8px;height:8px;border-radius:50%;background:var(--text);display:block}
.tab.dirty .t-close:hover .dot{display:none}
.tab.dirty .t-close:hover::after{content:"\00d7";font-size:15px;line-height:1}
#crumbs{height:22px;display:flex;align-items:center;padding:0 12px;color:var(--subtext);font-size:11px;gap:4px;flex:0 0 auto;overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--border)}
#crumbs .sep{color:var(--muted)}
#crumbs .last{color:var(--text)}
#banner{display:none;align-items:center;gap:10px;padding:6px 12px;font-size:12px;flex:0 0 auto;border-bottom:1px solid var(--border)}
#banner.show{display:flex}
#banner.warn{background:#3a2a07;color:#fcd34d}
#banner.info{background:var(--accent-faint);color:var(--accent)}
#banner .sp{flex:1}
#banner .btn{padding:2px 10px}
#editor-wrap{position:relative;flex:1 1 auto;min-height:0}
#ed-monaco{position:absolute;inset:0;user-select:text;-webkit-user-select:text}
.overlay-panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--subtext);text-align:center;padding:24px;background:var(--bg)}
.overlay-panel.show{display:flex}
#welcome h1{margin:0;font-size:22px;font-weight:600;color:var(--text);letter-spacing:.01em}
#welcome .sub{color:var(--muted);margin-bottom:6px}
#welcome .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#welcome .keys{margin-top:14px;display:grid;grid-template-columns:auto auto;gap:6px 18px;text-align:left;color:var(--subtext)}
#welcome kbd{background:var(--surface2);border:1px solid var(--border2);border-radius:4px;padding:1px 6px;font:11px var(--mono);color:var(--text)}
#welcome .recent{margin-top:14px;max-width:420px;text-align:left}
#welcome .recent a{display:block;color:var(--accent);cursor:pointer;padding:1px 0}
#welcome .recent a:hover{text-decoration:underline}
#welcome .recent h3{margin:0 0 4px;font-size:11px;color:var(--subtext);text-transform:uppercase;letter-spacing:.05em}
/* ── status bar ── */
#status{height:22px;display:flex;align-items:center;background:var(--panel);border-top:1px solid var(--border);color:var(--subtext);font-size:11px;flex:0 0 auto;padding:0 4px}
#status .sp{flex:1}
#status .it{padding:0 8px;height:22px;display:inline-flex;align-items:center;cursor:default;white-space:nowrap}
#status .it.btn2{cursor:pointer}
#status .it.btn2:hover{background:var(--surface2);color:var(--text)}
#status .it.on{color:var(--accent)}
#status .it.warn{color:var(--yellow)}
#status .it.err{color:var(--red)}
.ai-del-line{background:rgba(239,68,68,.16)}
.ai-del-text{text-decoration:line-through;text-decoration-color:rgba(239,68,68,.75);opacity:.7}
.ai-zone{background:rgba(16,185,129,.12);color:var(--text);overflow:hidden;white-space:pre;tab-size:4;user-select:none;-webkit-user-select:none}
.ai-zbar{position:absolute;top:0;bottom:0;width:4px}
.ai-edit-line{background:rgba(234,179,8,.14)}
.ai-gm-del,.ai-gm-edit{width:4px!important;margin-left:7px}
.ai-gm-del{background:#ef4444}
.ai-gm-edit{background:#eab308}
/* ── Open full VS Code IDE: prominent button in the editor tab strip ── */
#btn-ide{display:inline-flex;align-items:center;gap:7px;height:26px;margin:0 8px 0 4px;padding:0 14px 0 11px;border-radius:6px;border:1px solid var(--accent);background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dim) 100%);color:#fff;font:600 12px/1 var(--ui);letter-spacing:.01em;cursor:pointer;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 4px 14px -4px var(--accent-dim);transition:filter .12s,transform .08s,box-shadow .12s}
#btn-ide:hover{filter:brightness(1.12);box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 6px 18px -4px var(--accent)}
#btn-ide:active{transform:translateY(1px);filter:brightness(.96)}
#btn-ide:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#btn-ide svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
/* ── floating ui ── */
#btn-run{color:#3fb950}
#btn-run svg{fill:currentColor;stroke:none}
#btn-run:disabled{opacity:.35;color:inherit;cursor:default}
/* terminal panel (shares Midum's persistent shells) */
#term{display:none;flex:0 0 auto;flex-direction:column;background:var(--bg);border-top:1px solid var(--border2);min-height:90px}
#term.open{display:flex}
#term-rz{height:4px;margin-top:-2px;cursor:ns-resize;flex:0 0 auto;position:relative;z-index:2}
#term-rz:hover,#term-rz.drag{background:var(--accent)}
#term-hdr{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto}
#term-hdr .sp{flex:1}
#term-tabs{display:flex;gap:2px}
.tt{background:none;border:0;border-bottom:2px solid transparent;color:var(--subtext);padding:4px 8px;cursor:pointer;font:inherit}
.tt:hover{color:var(--text)}
.tt.on{color:var(--text);border-bottom-color:var(--accent)}
.tt:disabled{opacity:.4;cursor:default}
#term-hdr label{display:inline-flex;align-items:center;gap:4px;color:var(--subtext);cursor:pointer;font-size:11px}
#term-hdr .tb{background:none;border:1px solid var(--border2);border-radius:4px;color:var(--subtext);padding:0 8px;height:20px;cursor:pointer;font:inherit;font-size:11px}
#term-hdr .tb:hover{color:var(--text);border-color:var(--accent)}
#term-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 10px;font:12px/1.5 var(--mono);user-select:text;-webkit-user-select:text;cursor:text}
.tl{white-space:pre-wrap;word-break:break-word}
.tl.c{font-weight:600}
.tl.m{color:var(--subtext);font-style:italic}
.tl .tw,.tl .tp{color:var(--subtext)}
.tl .ts{color:var(--accent)}
#term-prompt{display:flex;align-items:center;font-weight:600}
#term-pl{color:var(--subtext);white-space:pre}
#term-sym{color:var(--accent);margin:0 6px 0 4px}
#term-in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;padding:0;user-select:text;-webkit-user-select:text}
#menu{position:fixed;display:none;z-index:50;min-width:190px;background:var(--panel);border:1px solid var(--border2);border-radius:7px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#menu.show{display:block}
#menu .mi{display:flex;padding:5px 12px;border-radius:4px;cursor:pointer;color:var(--text);gap:20px;align-items:center}
#menu .mi:hover{background:var(--accent-faint)}
#menu .mi.dis{opacity:.4;pointer-events:none}
#menu .mi .k{margin-left:auto;color:var(--muted);font-size:11px}
#menu .sepl{height:1px;background:var(--border2);margin:4px 2px}
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:60;padding-top:15vh}
#modal-bg.show{display:flex}
#modal{background:var(--panel);border:1px solid var(--border2);border-radius:10px;padding:16px 18px;min-width:340px;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#modal h2{margin:0 0 6px;font-size:14px}
#modal p{margin:0 0 14px;color:var(--subtext);line-height:1.5;white-space:pre-wrap}
#modal input{width:100%;margin-bottom:14px;background:var(--bg);border:1px solid var(--border2);color:var(--text);border-radius:5px;padding:6px 8px;font:inherit;outline:none;user-select:text;-webkit-user-select:text}
#modal input:focus{border-color:var(--accent)}
#modal .bt{display:flex;gap:8px;justify-content:flex-end}
#quick-bg{position:fixed;inset:0;display:none;z-index:70;align-items:flex-start;justify-content:center;padding-top:10vh}
#quick-bg.show{display:flex}
#quick{width:min(560px,92%);background:var(--panel);border:1px solid var(--border2);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.6);overflow:hidden}
#quick input{width:100%;border:0;border-bottom:1px solid var(--border2);background:var(--surface);color:var(--text);padding:10px 14px;font:13px var(--ui);outline:none;user-select:text;-webkit-user-select:text}
#quick-list{max-height:320px;overflow:auto}
#quick-list .qi{display:flex;align-items:center;gap:8px;padding:5px 14px;cursor:pointer;color:var(--text)}
#quick-list .qi.sel{background:var(--accent-faint)}
#quick-list .qi .d{color:var(--muted);font-size:11px;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
#quick-list .none{padding:12px 14px;color:var(--muted)}
#toasts{position:fixed;right:12px;bottom:30px;display:flex;flex-direction:column;gap:6px;z-index:80;pointer-events:none}
.toast{background:var(--surface2);border:1px solid var(--border2);border-left:3px solid var(--accent);padding:7px 12px;border-radius:6px;max-width:340px;box-shadow:0 8px 20px rgba(0,0,0,.4);animation:tin .15s}
.toast.err{border-left-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);z-index:90;color:var(--subtext);padding:30px;text-align:center}
#fatal.show{display:flex}
#fatal code{color:var(--red);font:11px var(--mono);max-width:560px;white-space:pre-wrap}
.monaco-editor .scroll-decoration{display:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:padding-box;border:2px solid transparent}
.ai-edit-flash{background:var(--accent-faint);box-shadow:inset 3px 0 0 var(--accent)}
#modal.wide{max-width:min(920px,92vw);min-width:540px;width:92vw}
.aidiff{max-height:48vh;overflow:auto;background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px 0;margin:0 0 10px;font:12px/1.45 Consolas,"Cascadia Mono",monospace;user-select:text;-webkit-user-select:text}
.aidiff div{padding:0 10px;white-space:pre}
.aidiff .add{background:rgba(63,185,80,.16)}
.aidiff .del{background:rgba(248,81,73,.16)}
.aidiff .hunk{color:var(--subtext);opacity:.8}

/* ── Glass Surfaces ───────────────────────────────────────────────────────────────────────
   applyThemeVars() (JS) sets html.glass-on and swaps --bg/--panel/--surface/--surface2 for translucent versions
   (--bg fully clear; the opaque originals live on as --bg-raw, --panel-raw, ...), so every surface above that
   paints from those vars -- sidebar, tab strip, status bar, terminal, rows, buttons -- goes see-through with no
   per-element rewrite. The host iframe is clear too, so the main window's ambient blobs / background image show
   through the whole Editor. The rules below only add the glass look (sheen + edges) and keep popups readable.
   Same token recipe as the main window (no backdrop-filter). */
:root{
  --glass-pct:55%;
  --glass-sheen:color-mix(in srgb, white calc(var(--glass-pct) * 0.55), transparent);
  --glass-sheen-soft:color-mix(in srgb, white calc(var(--glass-pct) * 0.2), transparent);
  --glass-edge:color-mix(in srgb, white calc(var(--glass-pct) * 0.6), transparent);
  --glass-edge-dim:color-mix(in srgb, white calc(var(--glass-pct) * 0.22), transparent);
  --glass-glow:0 6px 18px -10px rgba(0,0,0,.45);
  --glass-fill:color-mix(in srgb, var(--panel-raw, var(--panel)) var(--glass-pct), transparent);
  --glass-fill-strong:color-mix(in srgb, var(--panel-raw, var(--panel)) calc(var(--glass-pct) + 10%), transparent);
  --glass-pop:color-mix(in srgb, var(--panel-raw, var(--panel)) calc(var(--glass-pct) + 20%), transparent);
}
html.glass-no-sheen{--glass-sheen:transparent;--glass-sheen-soft:transparent;}
html.glass-on #side,html.glass-on #tabs-wrap,html.glass-on #status,html.glass-on #term-hdr{
  background-image:linear-gradient(150deg, var(--glass-sheen) 0%, var(--glass-sheen-soft) 30%, transparent 55%);
  border-color:var(--glass-edge-dim);
}
html.glass-on #term{border-top-color:var(--glass-edge-dim);}
html.glass-on .sec.art{border-top-color:var(--glass-edge-dim);}
html.glass-on .tab.active{background-color:var(--glass-fill-strong);box-shadow:inset 0 2px 0 var(--accent), inset 0 1px 0 var(--glass-edge);}
html.glass-on .btn,html.glass-on .row input,html.glass-on #modal input,html.glass-on .aidiff{
  background-color:var(--glass-fill);border-color:var(--glass-edge-dim);
}
html.glass-on .row input{border-color:var(--accent);}
html.glass-on .overlay-panel,html.glass-on #fatal{background-color:var(--glass-fill);}
html.glass-on #menu,html.glass-on #modal,html.glass-on #quick,html.glass-on .toast{
  background-color:var(--glass-pop);
  background-image:linear-gradient(150deg, var(--glass-sheen) 0%, var(--glass-sheen-soft) 30%, transparent 55%);
  border-color:var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-edge), 0 10px 30px rgba(0,0,0,.4);
}
html.glass-on .toast{border-left-color:var(--accent);}
html.glass-on #quick input{background-color:transparent;border-bottom-color:var(--glass-edge-dim);}
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <div class="side-title"><span>EXPLORER</span><span class="sp"></span>
      <button class="ib" id="btn-openfile" title="Open File..."><svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg></button>
      <button class="ib" id="btn-openfolder" title="Open Folder..."><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
    </div>
    <div class="sec ws" id="sec-ws">
      <div class="sec-hdr" id="ws-hdr"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg><span class="nm" id="ws-name">No folder open</span>
        <span class="acts">
          <button class="ib" data-act="new-file" title="New File"><svg viewBox="0 0 24 24"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M12 11v6M9 14h6"/></svg></button>
          <button class="ib" data-act="new-dir" title="New Folder"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M12 11v6M9 14h6"/></svg></button>
          <button class="ib" data-act="refresh" title="Refresh"><svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.65 4.36A9 9 0 0 0 20.5 15"/></svg></button>

/* ───────── tabs / models ───────── */
function newModel(tab, content){
  var uri = tab.kind === "artifact" ? monaco.Uri.from({scheme: "artifact", authority: tab.id, path: "/" + tab.name}) : monaco.Uri.file(tab.path);
  var old = monaco.editor.getModel(uri); if (old) old.dispose();
  var model = monaco.editor.createModel(content, tab.lang, uri);
  tab.model = model;
  tab.savedAlt = model.getAlternativeVersionId();
  tab.dirty = false;
  model.onDidChangeContent(function(){
    var wasDirty = tab.dirty, wasPrev = tab.preview;
    tab.dirty = model.getAlternativeVersionId() !== tab.savedAlt;
    if (tab.preview && tab.dirty) tab.preview = false;
    if (wasDirty !== tab.dirty || wasPrev !== tab.preview) renderTabs();
    if (tab.dirty) scheduleAutoSave(tab);
    if (tab.key === S.active) renderStatus();
  });
}
var autoTimers = {};
function scheduleAutoSave(tab){
  if (!S.autoSave || tab.readOnly || tab.conflict) return;
  clearTimeout(autoTimers[tab.key]);
  autoTimers[tab.key] = setTimeout(function(){ if (tab.dirty && S.tabs.indexOf(tab) >= 0) saveTab(tab); }, 1000);
}
function addTab(tab, replacePreview){
  if (replacePreview){
    var pi = S.tabs.findIndex(function(t){ return t.preview && !t.dirty; });
    if (pi >= 0){ disposeTab(S.tabs[pi]); S.tabs.splice(pi, 1, tab); return; }
  }
  var ai = S.tabs.findIndex(function(t){ return t.key === S.active; });
  S.tabs.splice(ai >= 0 ? ai + 1 : S.tabs.length, 0, tab);
}
function disposeTab(t){
  if (t.model){ if (ED && ED.getModel() === t.model) ED.setModel(null); t.model.dispose(); t.model = null; }
  clearTimeout(autoTimers[t.key]);
}
function findTab(key){ return S.tabs.find(function(t){ return t.key === key; }); }

async function openFile(path, opts){
  opts = opts || {};
  var key = "file:" + pkey(path), tab = findTab(key);
  if (tab){
    if (!opts.preview) tab.preview = false;

    if (opts.line) reveal(opts.line, opts.col);
    return tab;
  }
  var r;
  try { r = await rpc("editor_read_file", path); } catch (e) { toast("Could not open " + baseName(path) + ": " + e.message, "err"); return null; }
  if (!r.ok){ toast("Could not open " + baseName(path) + ": " + r.error, "err"); return null; }
  tab = {key: key, kind: "file", path: r.path || path, name: baseName(path), preview: !!opts.preview, mtime: r.mtime, size: r.size,
         encoding: r.encoding || "utf-8", bom: !!r.bom, readOnly: r.writable === false, binary: !!r.binary, tooLarge: !!r.too_large, dirty: false, viewState: null};
  tab.lang = langFor(tab.name);
  if (!tab.binary && !tab.tooLarge) newModel(tab, r.content);
  addTab(tab, !!opts.preview);

}
async function openArtifact(id, opts){
  opts = opts || {};

  }

  if (!r.ok){ toast(r.error || "Could not open artifact", "err"); return null; }
  tab = {key: key, kind: "artifact", id: r.id, name: r.name, preview: !!opts.preview, version: r.version, readOnly: !r.editable,
         origin: r.origin, artType: r.art_type, dirty: false, viewState: null};
  tab.lang = langFor(tab.name);

}
function reveal(line, col){

}

function activate(key, o){
  o = o || {};

async function closeTab(key, force){
  var i = S.tabs.findIndex(function(t){ return t.key === key; }); if (i < 0) return true;
  var t = S.tabs[i];
  if (t.dirty && !force){
    var r = await modal({title: "Unsaved changes", message: "Do you want to save the changes you made to " + t.name + "?\nYour changes will be lost if you don't save them.",
      buttons: [{label: "Don't Save", value: "discard"}, {label: "Cancel", value: null}, {label: "Save", value: "save", primary: true}]});
    if (r === null) return false;
    if (r === "save"){ var ok = await saveTab(t); if (!ok) return false; }
  }
  var was = S.active === key;
  disposeTab(t);
  S.tabs.splice(i, 1);
  if (was){ var next = S.tabs[Math.min(i, S.tabs.length - 1)]; activate(next ? next.key : null, {focus: !!next}); }
  else { renderTabs(); persist(); }
  return true;
}
async function closeMany(list){ for (var i = 0; i < list.length; i++){ if (!(await closeTab(list[i].key))) return; } }

/* ───────── saving / reloading / external changes ───────── */
async function saveTab(tab){
  if (!tab || !tab.model) return false;
  if (tab.readOnly && tab.kind === "artifact") return saveAsCopy(tab);
  var content = tab.model.getValue(), r, alt = tab.model.getAlternativeVersionId(), force = !!tab.forceSave;
  try {
    if (tab.kind === "artifact") r = await rpc("editor_save_artifact", tab.id, content, force ? null : tab.version);
    else r = await rpc("editor_write_file", tab.path, content, tab.encoding, tab.bom, force ? null : tab.mtime);
  } catch (e){ toast("Save failed: " + e.message, "err"); return false; }
  if (r.conflict){
    tab.conflict = {msg: tab.kind === "artifact" ? "Midum changed this artifact (now v" + r.version + ") while you were editing." : "This file changed on disk since you opened it.",
                    latest: tab.kind === "artifact" ? {version: r.version} : {mtime: r.mtime}};
    if (tab.key === S.active) renderBanner();
    toast("Save blocked: the content changed elsewhere. Choose Reload or Keep my version.", "err");
    return false;
  }
  if (!r.ok){ toast("Save failed: " + r.error, "err"); return false; }
  tab.forceSave = false; tab.conflict = null; tab.deleted = false;
  if (tab.kind === "artifact"){ tab.version = r.version; } else { tab.mtime = r.mtime; tab.size = r.size; if (r.encoding) tab.encoding = r.encoding; }
  tab.savedAlt = alt; tab.dirty = tab.model.getAlternativeVersionId() !== alt; tab.preview = false;
  if (tab.key === S.active && ED) ED.updateOptions({readOnly: !!tab.readOnly});
  renderTabs(); renderBanner(); renderStatus();
  if (tab.kind === "file" && S.workspace && isUnder(tab.path, S.workspace)) refreshTree();
  return true;
}
function saveActive(){ var t = activeTab(); if (t) return saveTab(t); }
async function saveAll(){ for (var i = 0; i < S.tabs.length; i++){ if (S.tabs[i].dirty) await saveTab(S.tabs[i]); } }
async function saveAsCopy(tab){
  var suggested = tab.name.replace(/(\.[^.]*)?$/, function(m){ return "-copy" + (m || ""); });
  var name = await promptDlg("Save as a new artifact", suggested, "Creates an editable copy in this chat's artifacts.");
  if (!name || !name.trim()) return false;
  var r = await rpc("editor_save_artifact_copy", name.trim(), tab.model.getValue());
  if (!r.ok){ toast(r.error || "Could not save copy", "err"); return false; }
  toast("Saved as " + r.name); await refreshArtifacts(); openArtifact(r.id); return true;
}
function applyContent(tab, text){
  tab.model.pushStackElement();
  tab.model.pushEditOperations([], [{range: tab.model.getFullModelRange(), text: text}], function(){ return null; });
  tab.model.pushStackElement();
  tab.savedAlt = tab.model.getAlternativeVersionId(); tab.dirty = false;
}
async function reloadTab(tab){
  try {
    if (tab.kind === "artifact"){
      var r = await rpc("editor_open_artifact", tab.id);
      if (!r.ok) return toast(r.error, "err");
      applyContent(tab, r.content); tab.version = r.version; tab.readOnly = !r.editable;
    } else {
      var f = await rpc("editor_read_file", tab.path);
      if (!f.ok || f.binary || f.too_large) return toast(f.error || "Cannot reload this file", "err");
      applyContent(tab, f.content); tab.mtime = f.mtime; tab.size = f.size;
    }
    tab.conflict = null; tab.forceSave = false; tab.deleted = false;
    renderTabs(); renderBanner(); renderStatus();
  } catch (e){ toast("Reload failed: " + e.message, "err"); }
}
async function externalChange(tab, freshText, label, latest){
  if (tab.model.getValue() === freshText) return true;          // same text: only the stamp moved
  if (!tab.dirty){ applyContent(tab, freshText); toast(tab.name + " " + label); renderTabs(); renderStatus(); return true; }
  tab.conflict = {msg: tab.kind === "artifact" ? "Midum changed this artifact while you have unsaved edits." : "This file changed on disk while you have unsaved edits.", latest: latest};
  if (tab.key === S.active) renderBanner();
  return false;
}
var polling = false;
async function pollOnce(){
  if (polling || !booted || window.innerWidth < 60) return;
  polling = true;
  try {
    var files = S.tabs.filter(function(t){ return t.kind === "file" && !t.binary && !t.tooLarge && t.model; });
    if (files.length){
      var r = await rpc("editor_stat", files.map(function(t){ return t.path; }));
      if (r.ok) for (var i = 0; i < files.length; i++){
        var t = files[i], st = r.stats[t.path]; if (!st) continue;
        if (!st.exists){ if (!t.deleted){ t.deleted = true; if (t.key === S.active){ ED.updateOptions({readOnly: true}); renderBanner(); } renderTabs(); } continue; }
        if (t.deleted){ t.deleted = false; if (t.key === S.active){ ED.updateOptions({readOnly: !!t.readOnly}); renderBanner(); } renderTabs(); }
        if (t.conflict) continue;
        if (st.mtime !== t.mtime || st.size !== t.size){
          var f = await rpc("editor_read_file", t.path);
          if (f.ok && !f.binary && !f.too_large){
            var synced = await externalChange(t, f.content, "was reloaded (changed on disk)", {mtime: f.mtime, size: f.size});
            if (synced){ t.mtime = f.mtime; t.size = f.size; }
          }
        }
      }
    }
    var arts = S.tabs.filter(function(t){ return t.kind === "artifact" && t.model; });
    if (arts.length){
      var a = await rpc("editor_artifact_stat", arts.map(function(t){ return t.id; }));
      if (a.ok) for (var j = 0; j < arts.length; j++){
        var at = arts[j], as = a.stats[at.id]; if (!as) continue;
        if (!as.exists){ if (!at.deleted){ at.deleted = true; renderTabs(); } continue; }
        if (at.conflict) continue;
        if (as.version !== at.version && !at.readOnly){
          var o = await rpc("editor_open_artifact", at.id);
          if (o.ok){
            var ok2 = await externalChange(at, o.content, "was updated by Midum (v" + o.version + ")", {version: o.version});
            if (ok2){ at.version = o.version; renderTabs(); renderStatus(); }
          }
        }
      }
    }
    await refreshArtifacts();
    await refreshTree();
  } catch (e) { /* transient (e.g. mid-save); the next tick retries */ }
  polling = false;
}
setInterval(pollOnce, 2500);

/* ───────── explorer: workspace tree ───────── */
async function loadDir(path){
  var r;
  try { r = await rpc("editor_list_dir", path); } catch (e) { r = {ok: false, error: e.message}; }

  var sig = r.entries.map(function(e){ return e.name + (e.is_dir ? "/" : "") + e.mtime + ":" + e.size; }).join("|") + (r.truncated ? "+" : "");
  var prev = T.dirs.get(path);

async function commitEdit(name){

  if (ed.mode === "new"){
    var target = joinP(ed.parent, name.replace(/\\/g, "/").split("/").join(sepOf(ed.parent)));
    var r = await rpc("editor_create", target, !!ed.isDir);
    if (!r.ok){ toast(r.error, "err"); renderTree(); return; }
    var rel = target.slice(ed.parent.length).replace(/^[\\\/]+/, "").split(/[\\\/]/), cur = ed.parent;
    for (var i = 0; i < rel.length - (ed.isDir ? 0 : 1); i++){ cur = joinP(cur, rel[i]); S.expanded.add(cur); }

    var np = joinP(dirName(ed.path), name);

    var rr = await rpc("editor_rename", ed.path, np);

  S.expanded = nexp;

    t.path = np; t.name = baseName(np); t.key = "file:" + pkey(np); t.lang = langFor(t.name);

/* Handoff with the full IDE. Both editors read and write the same files and editor_state.json; what lives only in memory
   (unsaved buffers, active tab, cursor, shared settings) travels in this message so the two always show one session. */
async function handoffOut(){
  var tabs = S.tabs.map(function(t){
    var o = {key: t.key, kind: t.kind, path: t.path || "", id: t.id || "", name: t.name, dirty: !!t.dirty, readOnly: !!t.readOnly, preview: !!t.preview};
    if (t.model){
      if (t.dirty) o.content = t.model.getValue();
      if (t.key === S.active && ED){ var p = ED.getPosition(); if (p){ o.line = p.lineNumber; o.col = p.column; } }
    }
    return o;
  });
  try {                                                   // the IDE boots from editor_state.json, so write it now, not after the debounce
    await rpc("editor_set_state", {
      workspace: S.workspace, recent: S.recent, active: S.active, expanded: Array.from(S.expanded), collapsed: S.collapsed,
      sideWidth: S.sideWidth, fontSize: S.fontSize, wordWrap: S.wordWrap, minimap: S.minimap, autoSave: S.autoSave,
      termOpen: S.termOpen, termSync: S.termSync, termHeight: S.termHeight, termShell: S.termShell, inlineAI: S.inlineAI, aiApprove: S.aiApprove,
      tabs: S.tabs.map(function(t){ return {key: t.key, kind: t.kind, path: t.path, id: t.id, name: t.name, preview: !!t.preview}; })
    });
  } catch (e) {}
  return {workspace: S.workspace, active: S.active, tabs: tabs,
          settings: {fontSize: S.fontSize, wordWrap: S.wordWrap, minimap: S.minimap, autoSave: S.autoSave, inlineAI: S.inlineAI, aiApprove: S.aiApprove, termShell: S.termShell}};
}
async function handoffIn(d){
  var t0 = Date.now();
  while (!booted && Date.now() - t0 < 20000) await new Promise(function(r){ setTimeout(r, 100); });
  var st = d.settings || {};
  if (typeof st.fontSize === "number" && st.fontSize !== S.fontSize){ S.fontSize = st.fontSize; if (ED) ED.updateOptions({fontSize: S.fontSize}); }
  if (typeof st.wordWrap === "boolean" && st.wordWrap !== S.wordWrap){ S.wordWrap = st.wordWrap; if (ED) ED.updateOptions({wordWrap: S.wordWrap ? "on" : "off"}); }
  if (typeof st.minimap === "boolean" && st.minimap !== S.minimap){ S.minimap = st.minimap; if (ED) ED.updateOptions({minimap: {enabled: S.minimap}}); }
  if (typeof st.autoSave === "boolean") S.autoSave = st.autoSave;
  if (typeof st.aiApprove === "boolean") S.aiApprove = st.aiApprove;
  if (typeof st.inlineAI === "boolean" && st.inlineAI !== S.inlineAI) aiToggle(st.inlineAI);
  if (st.termShell === "wsl" || st.termShell === "powershell") S.termShell = st.termShell;
  if (d.workspace && pkey(d.workspace) !== pkey(S.workspace || "")) await setWorkspace(d.workspace, true);
  var keep = {}, i;
  for (i = 0; i < (d.tabs || []).length; i++){
    var t = d.tabs[i], tab = findTab(t.key); keep[t.key] = 1;
    if (!tab){
      try { tab = t.kind === "artifact" ? await openArtifact(t.id, {preview: !!t.preview}) : await openFile(t.path, {preview: !!t.preview}); } catch (e) { tab = null; }
    }
    if (!tab || !tab.model) continue;
    if (t.dirty && typeof t.content === "string"){
      if (tab.model.getValue().replace(/\r\n/g, "\n") !== t.content){
        tab.model.pushStackElement();
        tab.model.pushEditOperations([], [{range: tab.model.getFullModelRange(), text: t.content}], function(){ return null; });
        tab.model.pushStackElement();
      }
      tab.dirty = tab.model.getAlternativeVersionId() !== tab.savedAlt; tab.conflict = null;
    } else {
      await reloadTab(tab);                                  // clean in the IDE: take the file as it is on disk now
    }
  }
  var extra = S.tabs.filter(function(x){ return !keep[x.key]; });        // closed in the IDE: close here (its unsaved edits were discarded there)
  for (i = 0; i < extra.length; i++) await closeTab(extra[i].key, true);
  if (d.active && findTab(d.active)){
    activate(d.active, {focus: false});
    var at = (d.tabs || []).find(function(x){ return x.key === d.active; });
    if (at && at.line) reveal(at.line, at.col);
  } else if (S.tabs.length) activate(S.tabs[0].key, {focus: false});
  renderTabs(); renderStatus(); renderPanels(); persist();
  rpc("editor_ai_hello").catch(function(){});             // this is the editor the chat model talks to again
}

/* global shortcuts (focus outside Monaco; Monaco handles + cancels its own) */
document.addEventListener("keydown", function(e){
  if (e.defaultPrevented) return;
  var mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && !e.shiftKey && k === "s"){ e.preventDefault(); saveActive(); }
  else if (mod && e.shiftKey && k === "s"){ e.preventDefault(); saveAll(); }
  else if (mod && k === "p" && !e.shiftKey){ e.preventDefault(); openQuickOpen(); }
  else if (mod && k === "w"){ e.preventDefault(); if (S.active) closeTab(S.active); }

/* ───────── terminal panel: the SAME persistent shells as Midum's Shell tab ─────────
   Every line either side (the model via execute_wsl_command / execute_terminal_command, or the
   user typing here or in the Shell tab) streams in as an "editor_shell_line" event; history is
   replayed on boot. Lines carry a per-shell seq number so replay + live never duplicate. */
var TERM = {shell: "wsl", lines: {wsl: [], powershell: []}, seen: {wsl: 0, powershell: 0}, ready: {wsl: false, powershell: false},
            buf: {wsl: [], powershell: []}, cwd: {wsl: "~", powershell: "~"}, info: [], cmds: {wsl: [], powershell: []}, idx: -1};
var TERM_CAP = 1000;
function termLine(l){
  var ps = l.shell === "powershell";
  if (l.stream === "cmd"){
    var who = l.origin === "model" ? "[model] " : (l.origin === "editor" ? "[editor] " : "");
    return '<div class="tl c">' + (who ? '<span class="tw">' + who + '</span>' : "") + '<span class="tp">' + (ps ? "PS " : "") + esc(l.cwd || "") + '</span> <span class="ts">' + (ps ? "&gt;" : "$") + '</span> ' + esc(l.text) + '</div>';
  }
  if (l.stream === "meta") return '<div class="tl m">' + esc(l.text) + '</div>';
  return '<div class="tl">' + esc(l.text) + '</div>';
}
function termScroll(){ var b = $("#term-body"); b.scrollTop = b.scrollHeight; }
function termPrompt(){
  var ps = TERM.shell === "powershell";
  $("#term-pl").textContent = (ps ? "PS " : "") + TERM.cwd[TERM.shell];
  $("#term-sym").textContent = ps ? ">" : "$";
}
function termRenderAll(){
  $("#term-out").innerHTML = TERM.lines[TERM.shell].map(termLine).join("");
  termPrompt(); termScroll();
}
function termRenderTabs(){
  var list = TERM.info.length ? TERM.info : [{kind: "wsl", label: "WSL2", available: true}, {kind: "powershell", label: "PowerShell", available: true}];
  $("#term-tabs").innerHTML = list.map(function(s){
    return '<button class="tt' + (s.kind === TERM.shell ? " on" : "") + '" data-k="' + s.kind + '"' + (s.available ? "" : " disabled title=\"not available on this machine\"") + '>' + esc(s.label) + '</button>';
  }).join("");
}
function termAdd(l){
  var k = l.shell || "wsl";
  if (typeof l.seq === "number"){ if (l.seq <= TERM.seen[k]) return; TERM.seen[k] = l.seq; }
  var arr = TERM.lines[k]; arr.push(l); if (arr.length > TERM_CAP) arr.shift();
  if (l.stream === "meta" && l.cwd) TERM.cwd[k] = l.cwd;
  if (!S.termOpen || k !== TERM.shell) return;
  var out = $("#term-out");
  out.insertAdjacentHTML("beforeend", termLine(l));
  while (out.childNodes.length > TERM_CAP) out.removeChild(out.firstChild);
  if (l.stream === "meta") termPrompt();
  termScroll();
}
function termOnLine(p){
  var k = p.shell || "wsl";
  if (!TERM.ready[k]){ TERM.buf[k].push(p); return; }   // history replay still loading
  termAdd(p);
}
function termSyncWorkspace(force){
  if (S.termSync && S.workspace) rpc("editor_term_link", S.workspace, !!force).catch(function(){});
}
function applyTerm(){
  $("#term").classList.toggle("open", !!S.termOpen);
  $("#st-term").classList.toggle("on", !!S.termOpen);

}
/* ---- Run button: .py / .java run in the terminal panel's active shell; .html opens in the system browser ---- */
var RUN_EXT = {py: "Python", pyw: "Python", java: "Java", html: "HTML", htm: "HTML"};
function runKind(t){
  if (!t || t.kind !== "file" || t.binary || t.tooLarge) return null;

function renderRun(){
  var b = $("#btn-run"), t = activeTab(), k = runKind(t);

async function runActive(){

async function termBoot(){
  TERM.shell = S.termShell === "powershell" ? "powershell" : "wsl";

  try {
    var i = await rpc("editor_term_info");
    if (i && i.ok){ TERM.info = i.shells; i.shells.forEach(function(s){ if (s.cwd && s.cwd !== "~") TERM.cwd[s.kind] = s.cwd; }); }
  } catch (e) {}

(function(){

  $("#term-sync").onchange = function(){ S.termSync = this.checked; persist(); if (S.termSync) termSyncWorkspace(true); };
  $("#term-clear").onclick = function(){ TERM.lines[TERM.shell] = []; termRenderAll(); $("#term-in").focus(); };
  $("#term-restart").onclick = function(){ rpc("editor_term_restart", TERM.shell).catch(function(){}); $("#term-in").focus(); };
  $("#term-ws").onclick = async function(){

  $("#term-in").addEventListener("keydown", function(e){
    var inp = e.target, h = TERM.cmds[TERM.shell];
    if (e.key === "Enter"){

    } else if (e.key === "ArrowUp"){

    } else if (e.key === "ArrowDown"){

      e.preventDefault();

  var rz = $("#term-rz"), drag = false;
  rz.addEventListener("mousedown", function(e){ drag = true; rz.classList.add("drag"); e.preventDefault(); });
  window.addEventListener("mousemove", function(e){
    if (!drag) return;
    S.termHeight = Math.max(90, Math.min(innerHeight - 22 - e.clientY, Math.floor(innerHeight * 0.8)));
    $("#term").style.height = S.termHeight + "px"; if (ED) ED.layout();

/* ───────── events pushed from Midum ───────── */
function handleEvent(kind, p){
  p = p || {};
  if (kind === "editor_open_artifact" && p.id){ refreshArtifacts().then(function(){ openArtifact(p.id, {preview: false}); }); }
  else if (kind === "editor_open_file" && p.path){ openFile(p.path, {preview: false, line: p.line, col: p.col}); }
  else if (kind === "editor_artifact_changed"){ pollOnce(); }
  else if (kind === "editor_shell_line" && p.text !== undefined){ termOnLine(p); }
  else if (kind === "editor_shell_lines" && p.lines){ p.lines.forEach(termOnLine); }
  else if (kind === "editor_open_folder" && p.path){ setWorkspace(p.path); }
  else if (kind === "editor_ai_request" && p.id){ aiHandle(p); }
}

/* Chat model <-> Editor (see editor_link.py). Python sends {id, op, args}; we act on the LIVE Monaco models and
   answer with editor_ai_reply. Ops: state, snapshot, edit, open_file, open_folder. */
var aiFlash = null;
function aiTabInfo(t){
  return {key: t.key, kind: t.kind, name: t.name, path: t.path || "", id: t.id || "", dirty: !!t.dirty,
          readOnly: !!(t.readOnly || t.deleted), active: t.key === S.active};
}
function aiState(){ return {ok: true, workspace: S.workspace, active: S.active, tabs: S.tabs.map(aiTabInfo)}; }
function aiFindTab(path){
  var q = pkey(path), hit = findTab("file:" + q);
  if (hit) return hit;
  var m = S.tabs.filter(function(x){ return x.path && (pkey(x.path) === q || pkey(x.path).slice(-(q.length + 1)) === "/" + q); });
  if (m.length === 1) return m[0];
  m = S.tabs.filter(function(x){ return (x.name || "").toLowerCase() === q.toLowerCase(); });
  return m.length === 1 ? m[0] : null;
}
function aiSnapshot(a){
  var out = aiState(); out.file = null;
  var tab = (a && a.path) ? aiFindTab(a.path) : activeTab();
  if (!tab) return out;
  var f = {key: tab.key, kind: tab.kind, name: tab.name, path: tab.path || "", id: tab.id || "", lang: tab.lang || ""};
  if (!tab.model){
    f.noText = true; f.reason = tab.binary ? "a binary file" : tab.tooLarge ? "too large to open in the editor" : "not a text tab";
    out.file = f; return out;
  }
  var m = tab.model, LF = monaco.editor.EndOfLinePreference.LF;
  f.dirty = !!tab.dirty; f.readOnly = !!(tab.readOnly || tab.deleted); f.deleted = !!tab.deleted; f.conflict = !!tab.conflict;
  f.version = m.getVersionId(); f.eol = m.getEOL() === "\r\n" ? "CRLF" : "LF"; f.lineCount = m.getLineCount();
  f.content = m.getValue(LF);
  if (ED && ED.getModel() === m){
    var p = ED.getPosition(); if (p) f.cursor = {line: p.lineNumber, col: p.column};
    var s = ED.getSelection();
    if (s && !s.isEmpty()) f.selection = {startLine: s.startLineNumber, startCol: s.startColumn, endLine: s.endLineNumber, endCol: s.endColumn, text: m.getValueInRange(s, LF)};
    var vr = ED.getVisibleRanges();
    if (vr.length) f.visible = {start: vr[0].startLineNumber, end: vr[vr.length - 1].endLineNumber};
  }
  try {
    f.problems = monaco.editor.getModelMarkers({resource: m.uri}).filter(function(k){ return k.severity >= 4; }).slice(0, 40)
      .map(function(k){ return {line: k.startLineNumber, col: k.startColumn, sev: k.severity >= 8 ? "error" : "warning", msg: String(k.message).slice(0, 200)}; });
  } catch (e) { f.problems = []; }
  out.file = f; return out;
}
function aiFlashLines(ranges){
  if (!ED || !ED.getModel() || !ranges || !ranges.length) return;
  var n = ED.getModel().getLineCount();
  var decs = ranges.map(function(r){
    var s = Math.max(1, Math.min(n, r.start)), e = Math.max(s, Math.min(n, r.end));
    return {range: new monaco.Range(s, 1, e, 1), options: {isWholeLine: true, className: "ai-edit-flash"}};
  });
  if (aiFlash){ try { aiFlash.clear(); } catch (e) {} }
  var mine = aiFlash = ED.createDecorationsCollection(decs);
  ED.revealLineInCenterIfOutsideViewport(decs[0].range.startLineNumber);
  setTimeout(function(){ try { mine.clear(); } catch (e) {} }, 2500);
}
async function aiEdit(a){
  var tab = activeTab();
  if (!tab || !tab.model) return {ok: false, error: "no editable text tab is active"};
  if (a.key && a.key !== tab.key) return {ok: false, stale: true, error: "the active tab changed"};
  if (tab.readOnly || tab.deleted) return {ok: false, error: tab.deleted ? "the file was deleted on disk" : "this tab is read-only"};
  var m = tab.model;
  if (a.version !== undefined && a.version !== null && m.getVersionId() !== a.version) return {ok: false, stale: true, error: "the buffer changed since it was read"};
  var eol = m.getEOL();

    return {range: new monaco.Range(e.sl, e.sc, e.el, e.ec), text: String(e.text).replace(/\r\n|\r|\n/g, eol), forceMoveMarkers: true};
  });

    m.pushEditOperations(ED && ED.getModel() === m ? ED.getSelections() : [], ops, function(){ return null; });
    m.pushStackElement();

  if (a.save) saved = await saveTab(tab);

}
async function aiOpenFile(a){
  var tab = await openFile(a.path, {preview: false, line: a.line, col: a.col});

}
async function aiOpenFolder(a){

/* Approval dialog for model edits: a diff + Approve / Reject (with an optional note for the model). Reject is focused
   by default and plain Enter does nothing, so a keystroke meant for the editor can never approve an edit. */
function aiApproveDlg(a){
  return new Promise(function(resolve){
    var bg = $("#modal-bg"), box = $("#modal"), finished = false, timer = null;
    var rows = (a.diff || []).map(function(l){
      var c = l.charAt(0) === "+" ? "add" : l.charAt(0) === "-" ? "del" : l.indexOf("@@") === 0 ? "hunk" : "";
      return '<div class="' + c + '">' + esc(l || " ") + "</div>";
    }).join("");
    var info = (a.changes || 0) + " change(s): +" + (a.added || 0) + " / -" + (a.removed || 0) + " lines. " +
      (a.save ? "It will also be saved to disk." : "It stays unsaved in the editor (Ctrl+Z undoes it).") + (a.path ? "\n" + a.path : "");
    box.classList.add("wide");
    box.innerHTML = "<h2>Midum wants to edit " + esc(a.name || "this file") + "</h2><p>" + esc(info) + "</p>" +
      '<div class="aidiff">' + (rows || "<div>(no visible difference)</div>") + "</div>" +
      '<input id="ai-note" placeholder="Optional note for Midum (sent if you reject)" spellcheck="false">' +
      '<div class="bt"><button class="btn" data-v="always">Approve &amp; don\'t ask again</button>' +
      '<button class="btn" data-v="no">Reject</button><button class="btn primary" data-v="yes">Approve</button></div>';
    bg.classList.add("show");
    function done(v, extra){
      if (finished) return; finished = true; clearTimeout(timer);
      var note = ($("#ai-note") || {}).value || "";
      bg.classList.remove("show"); box.classList.remove("wide"); document.removeEventListener("keydown", onKey, true);
      resolve(Object.assign({approved: v === "yes" || v === "always", always: v === "always", note: note}, extra || {}));
    }
    function onKey(e){
      if (e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); done("no"); }
      else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); e.stopPropagation(); done("yes"); }
      else if (e.key === "Enter" && e.target && e.target.id === "ai-note"){ e.stopPropagation(); }
    }
    document.addEventListener("keydown", onKey, true);
    box.onclick = function(e){ var b = e.target.closest("button[data-v]"); if (b) done(b.dataset.v); };
    if (a.timeoutMs) timer = setTimeout(function(){ done("no", {timedOut: true}); }, a.timeoutMs);
    var rej = box.querySelector('button[data-v="no"]'); if (rej) rej.focus();
  });
}
async function aiApprove(a){
  var r = await aiApproveDlg(a);

  return {ok: true, approved: !!r.approved, always: !!r.always, note: r.note || "", timedOut: !!r.timedOut};

function aiLinkInit(){
  if (!ED || aiLinkInit.done) return; aiLinkInit.done = true;
  ED.addAction({id: "midum.toggleAiEditApproval", label: "Midum: Toggle Approval for AI Edits", run: function(){

  }});
}
async function aiHandle(p){
  var res, a = p.args || {};

    if (p.op === "state") res = aiState();

/* ───────── boot ───────── */

  $("#fatal").classList.remove("show");
  var st;

  var s = (st && st.ok && st.state) || {};
  S.workspace = s.workspace || ""; S.recent = s.recent || []; S.expanded = new Set(s.expanded || []);
  S.collapsed = Object.assign({artifacts: false, workspace: false}, s.collapsed || {});
  if (s.sideWidth) S.sideWidth = s.sideWidth;
  if (s.fontSize) S.fontSize = s.fontSize;

  if (typeof s.autoSave === "boolean") S.autoSave = s.autoSave;
  if (typeof s.termOpen === "boolean") S.termOpen = s.termOpen;
  if (typeof s.inlineAI === "boolean") S.inlineAI = s.inlineAI;
  if (typeof s.termSync === "boolean") S.termSync = s.termSync;

  }

/* AI inline suggestions: ghost text from Gemini via the editor's local /api/inline endpoint.

var INLINE_TOKEN = '__INLINE_TOKEN__';
var AI_DELAY = 200, AI_PREFIX = 5000, AI_SUFFIX = 1500;

var AI = {state: 'idle', seq: 0, pausedUntil: 0, info: '', registered: false, warnedNoKeys: false, prop: null, propKey: null, pendingAccept: null, applying: false};
function aiPost(body, signal){
  return fetch(location.origin + '/api/inline', {method: 'POST', cache: 'no-store', signal: signal,
    headers: {'Content-Type': 'application/json', 'X-Midum-Token': INLINE_TOKEN}, body: JSON.stringify(body)})

function aiSet(state, info){ AI.state = state; if (info !== undefined) AI.info = info; renderAiStatus(); }
function renderAiStatus(){

  var txt = 'AI: off', cls = 'it btn2', tip = 'AI inline suggestions are off (click to turn on)';
  if (S.inlineAI){
    tip = 'AI inline suggestions (Gemini, gemini-3.1-flash-lite). Tab accepts, Alt + backslash triggers. Click to turn off.';
    if (AI.state === 'busy'){ txt = 'AI ...'; cls += ' on'; }
    else if (AI.state === 'cooling'){ txt = 'AI: cooling'; cls += ' warn'; }
    else if (AI.state === 'nokeys'){ txt = 'AI: no keys'; cls += ' err'; }
    else if (AI.state === 'error'){ txt = 'AI: error'; cls += ' err'; }
    else { txt = 'AI: on'; cls += ' on'; }

}
function aiContext(model, pos){
  var NL = String.fromCharCode(10), off = model.getOffsetAt(pos), a = Math.max(0, off - AI_PREFIX), p0 = model.getPositionAt(a);

function aiProvide(model, position, context, token){
  var empty = {items: []}, t = activeTab();
  if (!S.inlineAI || !t || t.model !== model || t.readOnly || t.deleted) return Promise.resolve(empty);
  if (AI_SKIP.test(t.name) || (t.path && AI_SKIP.test(baseName(t.path)))) return Promise.resolve(empty);
  if (context.selectedSuggestionInfo || Date.now() < AI.pausedUntil || AI.prop) return Promise.resolve(empty);
  var ictx = aiInstrContext(model, position);
  if (ictx && ictx.onComment && context.triggerKind !== monaco.languages.InlineCompletionTriggerKind.Explicit) return Promise.resolve(empty);   // still typing the comment: wait for Enter, or Alt + backslash
  if (!ictx && /^[A-Za-z0-9_$]/.test(model.getLineContent(position.lineNumber).slice(position.column - 1))) return Promise.resolve(empty);   // mid-identifier

  if (AI.state === 'busy') aiSet('idle');
  return new Promise(function(r){ setTimeout(r, (ictx || context.triggerKind === monaco.languages.InlineCompletionTriggerKind.Explicit) ? 0 : AI_DELAY); }).then(function(){
    if (token.isCancellationRequested || my !== AI.seq) return empty;
    var c = aiContext(model, position), ctrl = new AbortController();
    token.onCancellationRequested(function(){ ctrl.abort(); });
    aiSet('busy');
    var body = {op: 'suggest', prefix: c.prefix, suffix: c.suffix, lang: model.getLanguageId(), name: t.name};
    if (ictx) body.instr = {comment: ictx.comment, cursor: ictx.onComment ? 'end_of_comment_line' : 'blank_line_below_comment'};
    body.cursor = {line: position.lineNumber, col: position.column};

    if (ew) body.edit = ew;
    return aiPost(body, ctrl.signal).then(function(r){
      if (my !== AI.seq) return empty;
      if (r.ok){
        aiSet('idle', r.key ? 'last request: key ' + r.key + ' of ' + r.keys + (r.cached ? ' (cached)' : ', ' + r.ms + ' ms') : AI.info);
        var action = r.action || 'insert';

        }
        AI.pendingAccept = (ictx && r.is_instruction && r.text) ? {model: model, text: r.text, c: ictx} : null;
        if (!r.text) return empty;
        return {items: [{insertText: r.text, range: new monaco.Range(position.lineNumber, position.column, position.lineNumber, position.column)}]};
      }

      } else if (r.busy){ aiSet('idle'); }

    });
  }).catch(function(e){

    return empty;

}
// ---- instruction comments: the comment, plus the code block directly below it (the edit target) ----
function aiIsComment(s, lang){
  var t = s.trim();
  if (!t || lang === 'markdown' || lang === 'plaintext') return false;
  if (t.indexOf('//') === 0 || t.indexOf('/*') === 0 || t.indexOf('--') === 0 || t.indexOf('<!--') === 0) return true;
  var c = t.charAt(0);
  if (c === '*' || c === '%' || c === ';') return true;

}
function aiIndent(l){ var i = 0, tab = String.fromCharCode(9); while (i < l.length && (l.charAt(i) === ' ' || l.charAt(i) === tab)) i++; return i; }
function aiCloser(l){ var c = l.trim().charAt(0); return c === ')' || c === ']' || c === '}'; }
function aiTargetBlock(model, start){
  // first line below the comment, plus the rest of its statement/block (deeper-indented lines, a closing bracket)

  if (start > n || !model.getLineContent(start).trim()) return null;
  var base = aiIndent(model.getLineContent(start)), end = start, i, j, l, ind, t;
  for (i = start + 1; i <= n && i - start < 80; i++){
    l = model.getLineContent(i);
    if (!l.trim()){
      j = i + 1; while (j <= n && !model.getLineContent(j).trim()) j++;
      if (j <= n && j - start < 80 && aiIndent(model.getLineContent(j)) > base){ i = j - 1; continue; }
      break;
    }
    ind = aiIndent(l);
    if (ind > base){ end = i; continue; }
    if (ind === base && aiCloser(l)){
      end = i; t = l.trim();
      if ('{:('.indexOf(t.charAt(t.length - 1)) >= 0) continue;   // a line like  } else {  opens the next part
    }

}
function aiInstrContext(model, pos){
  var lang = model.getLanguageId(), ln = pos.lineNumber, cur = model.getLineContent(ln), onComment = false, cEnd = 0, k, i;
  if (aiIsComment(cur, lang)){
    if (cur.slice(pos.column - 1).trim() !== '') return null;   // cursor must be at the end of the comment line
    cEnd = ln; onComment = true;
  } else if (!cur.trim()){
    k = ln - 1; while (k >= 1 && k >= ln - 3 && !model.getLineContent(k).trim()) k--;
    if (k >= 1 && aiIsComment(model.getLineContent(k), lang)) cEnd = k; else return null;
  } else return null;
  var cStart = cEnd, NL = String.fromCharCode(10), lines = [], tl = [];
  while (cStart > 1 && cEnd - cStart < 12 && aiIsComment(model.getLineContent(cStart - 1), lang)) cStart--;
  for (i = cStart; i <= cEnd; i++) lines.push(model.getLineContent(i).trim());
  var tb = aiTargetBlock(model, ln + 1);
  if (tb) for (i = tb.start; i <= tb.end; i++) tl.push(model.getLineContent(i));
  return {cStart: cStart, cEnd: cEnd, comment: lines.join(NL), target: tl.join(NL), tStart: tb ? tb.start : 0, tEnd: tb ? tb.end : 0, onComment: onComment};
}

// ---- edit proposals (replace / delete): red = removed, green = new text; Tab applies, Esc dismisses ----
function aiDeleteRange(model, s, e){
  var n = model.getLineCount();
  if (e < n) return new monaco.Range(s, 1, e + 1, 1);
  if (s > 1) return new monaco.Range(s - 1, model.getLineMaxColumn(s - 1), e, model.getLineMaxColumn(e));
  return new monaco.Range(s, 1, e, model.getLineMaxColumn(e));
}
function aiClearProp(){
  var P = AI.prop; if (!P) return;
  AI.prop = null;
  if (AI.propKey) AI.propKey.set(false);
  try { if (P.coll) P.coll.clear(); } catch (e) {}
  try { if (P.zoneIds && P.zoneIds.length) ED.changeViewZones(function(acc){ P.zoneIds.forEach(function(id){ acc.removeZone(id); }); }); } catch (e) {}
}
function aiEditWindow(model, pos, ictx){
  // the only lines a replace / delete may touch: the code block under an instruction comment, else a few lines around the cursor
  var s, e, i, l, lines = [];
  if (ictx){ if (!ictx.target) return null; s = ictx.tStart; e = ictx.tEnd; }
  else { s = Math.max(1, pos.lineNumber - 2); e = Math.min(model.getLineCount(), pos.lineNumber + 4); }
  for (i = s; i <= e; i++){ l = model.getLineContent(i); if (l.length > 400) return null; lines.push(l); }
  return {start: s, lines: lines};
}
function aiDiffHunks(oldL, newL){
  // line diff (LCS): changed chunks as {o0,o1} old index range + {n0,n1} new index range; unchanged lines are left alone
  var n = oldL.length, m = newL.length, i, j, T = [], hunks = [], h = null;
  if (n * m > 40000) return [{o0: 0, o1: n, n0: 0, n1: m}];
  for (i = 0; i <= n; i++){ T.push([]); for (j = 0; j <= m; j++) T[i].push(0); }

    T[i][j] = oldL[i] === newL[j] ? T[i + 1][j + 1] + 1 : Math.max(T[i + 1][j], T[i][j + 1]);

  while (i < n || j < m){
    if (i < n && j < m && oldL[i] === newL[j]){ if (h){ hunks.push(h); h = null; } i++; j++; continue; }
    if (!h) h = {o0: i, o1: i, n0: j, n1: j};
    if (j < m && (i >= n || T[i][j + 1] >= T[i + 1][j])){ j++; h.n1 = j; } else { i++; h.o1 = i; }
  }

function aiZoneNode(lines, color, fi, lh){
  var li = ED.getLayoutInfo(), node = document.createElement('div'), bar = document.createElement('div');
  node.className = 'ai-zone';
  node.style.paddingLeft = li.contentLeft + 'px';
  node.style.fontFamily = fi.fontFamily; node.style.fontSize = fi.fontSize + 'px';
  bar.className = 'ai-zbar'; bar.style.left = (li.glyphMarginLeft + 7) + 'px'; bar.style.background = color;   // gutter marker, left of the line numbers
  node.appendChild(bar);
  lines.forEach(function(l){
    var d = document.createElement('div');
    d.style.height = lh + 'px'; d.style.lineHeight = lh + 'px'; d.textContent = l;
    node.appendChild(d);
  });
  return node;
}
function aiShowProp(P){
  // Draws the proposal as a diff. Marker in the gutter, left of the line numbers: green = added lines, red = deleted lines, yellow = edited lines.
  aiClearProp();
  var fi = ED.getOption(monaco.editor.EditorOption.fontInfo), lh = fi.lineHeight, M = P.model, decs = [], zones = [];

      options: {isWholeLine: true, className: edit ? 'ai-edit-line' : 'ai-del-line', inlineClassName: 'ai-del-text', glyphMarginClassName: edit ? 'ai-gm-edit' : 'ai-gm-del'}});

function aiShowEdit(model, ictx, r, ver, pos){

    endCursor: del ? null : {line: s + nw.length - 1, col: nw[nw.length - 1].length + 1},
    after: ictx ? function(){ aiOfferCommentDelete(model, ictx); } : null});   // an instruction was carried out: offer to delete its comment
}
function aiOfferCommentDelete(model, c){
  var t = activeTab();
  if (!t || t.model !== model || !c || c.cStart < 1 || c.cEnd > model.getLineCount()) return;
  var NL = String.fromCharCode(10), cur = [], raw = [], i;

function aiApplyProp(){

  if (!ok) return;
  AI.applying = true;
  try {
    ED.pushUndoStop();
    ED.executeEdits('midum-ai', P.edits.map(function(e){ return {range: e.range, text: e.text, forceMoveMarkers: true}; }));

function aiSetupEdits(){

function aiInit(){

function aiToggle(force){
  S.inlineAI = typeof force === 'boolean' ? force : !S.inlineAI;
  if (!S.inlineAI){ AI.seq++; aiClearProp(); }
  else { AI.pausedUntil = 0; AI.state = 'idle'; }
  if (ED) ED.updateOptions({inlineSuggest: {enabled: S.inlineAI, mode: 'subwordSmart', showToolbar: 'never'}});

}
function aiProbe(){
  aiPost({op: 'status'}).then(function(r){
    if (!r || !r.ok) return;
    if (!r.total) aiSet('nokeys', 'No Gemini API keys found in the secrets file.');
    else aiSet(AI.state === 'nokeys' ? 'idle' : AI.state, r.total + ' Gemini key' + (r.total > 1 ? 's' : '') + ' loaded (' + r.model + '), used round-robin with automatic hopping.');
  }).catch(function(){ aiSet('error', 'The suggestion service is not reachable.'); });
}
$('#st-ai').onclick = function(){ aiToggle(); };

$("#fatal-retry").onclick = boot;
window.__mzEditor = {S: S, T: T, openFile: openFile, openArtifact: openArtifact, activate: activate, saveActive: saveActive, closeTab: closeTab, setWorkspace: setWorkspace, pollOnce: pollOnce, get editor(){ return ED; }};
postParent({__ed: "ready"});
boot();
})();
